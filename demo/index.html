<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vehicle Scheduler</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="canvas"></canvas>

  <header class="bar">
    <span id="run-name">No run loaded</span>
    <button type="button" id="open" title="Open main.py output, plus the input file if you have it">Open</button>
    <input type="file" id="files" accept=".txt,text/plain" multiple hidden>
    <span class="sep"></span>
    <button type="button" id="prev" class="icon" title="Previous step (←)"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button type="button" id="play" class="icon" title="Play / pause (space)">
      <svg viewBox="0 0 24 24" id="icon-play"><path d="M8 5l11 7-11 7z"/></svg>
      <svg viewBox="0 0 24 24" id="icon-pause" hidden><path d="M9 5v14M15 5v14"/></svg>
    </button>
    <button type="button" id="next" class="icon" title="Next step (→)"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <span id="counter">0 / 0</span>
    <input type="range" id="slider" min="0" max="1" step="0.01" value="0" aria-label="Time">
    <span class="sep"></span>
    <button type="button" id="slower" class="icon" title="Slower"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
    <span id="speed">1x</span>
    <button type="button" id="faster" class="icon" title="Faster"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
    <span class="sep"></span>
    <span id="clock">--:--</span>
  </header>

  <aside class="card" id="fleet">
    <h2>Vehicles</h2>
    <ul id="vehicles"></ul>
  </aside>

  <aside class="card" id="story">
    <div id="status"></div>
    <details>
      <summary>Output</summary>
      <div id="log"></div>
    </details>
  </aside>

  <!-- latest.js is written by show.py: the input file and what main.py printed -->
  <script src="latest.js"></script>

  <script src="parse.js"></script>
  <script src="timeline.js"></script>
  <script src="draw.js"></script>
  <script src="app.js"></script>
</body>
</html>
